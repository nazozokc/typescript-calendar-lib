name: publish-react

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check release notes for publish target
        id: check
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          pkg="react"
          lines="$(printf '%s\n' "$RELEASE_BODY" | grep -iE '^[[:space:]]*publish[[:space:]]*:' | sed 's/^[[:space:]]*[Pp]ublish[[:space:]]*:[[:space:]]*//' | tr ',' ' ' | tr '\n' ' ')"
          if [ -z "$lines" ]; then
            enabled=true
          elif printf '%s' "$lines" | grep -qiE "(^|[[:space:],])${pkg}([[:space:],]|$)"; then
            enabled=true
          else
            enabled=false
          fi
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

  publish-react:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Get version from tag
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync package versions
        run: |
          version="${{ steps.version.outputs.version }}"
          for pkg in core tui web cli react svelte; do
            npm --prefix "packages/${pkg}" pkg set "version=${version}"
          done

      - name: Build packages
        run: pnpm -r run build

      - name: Publish
        run: |
          pnpm --filter "@typescript-calendar-lib/react" publish \
            --no-git-checks \
            --access public \
            --registry https://registry.npmjs.org/
