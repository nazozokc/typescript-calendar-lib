name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Get version from tag
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync package versions
        run: |
          version="${{ steps.version.outputs.version }}"
          for pkg in core tui web cli react svelte; do
            npm --prefix "packages/${pkg}" pkg set "version=${version}"
          done

      - name: Build packages
        run: pnpm -r run build

      - name: Publish all packages
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # Topological order: consumers are published after their dependencies.
          for pkg in core tui web cli react svelte; do
            name="@typescript-calendar-lib/${pkg}"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published, skipping"
              continue
            fi
            pnpm --filter "${name}" publish \
              --no-git-checks \
              --access public \
              --provenance \
              --registry https://registry.npmjs.org/
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
